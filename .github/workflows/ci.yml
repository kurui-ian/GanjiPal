name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  analyze_and_test:
    name: Analyze & Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Dart Installation
        run: |
          flutter --version
          dart --version

      - name: Get Core Dependencies & Run Domain Tests
        run: |
          cd packages/pesatrack_core
          dart pub get
          dart test

      - name: Get App Dependencies
        run: flutter pub get

      - name: Static Analysis
        run: flutter analyze

      - name: Run Flutter Widget & Unit Tests
        run: flutter test --coverage

      - name: Verify Web Bundle Build
        run: flutter build web --no-tree-shake-icons
